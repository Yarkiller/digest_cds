<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Digest CDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/typography.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="concept-nav"><a href="../index.html">← Concept 2</a> <strong>Вход</strong></div>

  <div class="auth-layout">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:var(--space-8);">
        <h1 class="text-h1" style="color:var(--color-primary);">Digest CDS</h1>
        <p class="text-caption">СВА · DS-направление</p>
      </div>
      <form class="form-stack" action="home.html" data-login-form>
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="field__input" id="email" type="email" placeholder="name@sberbank.ru" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" id="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <p class="field__error text-caption" data-login-error role="alert"></p>
        <button class="btn btn--primary btn--block" type="submit">Войти</button>
      </form>
      <p class="text-caption" style="text-align:center;margin-top:var(--space-6);">@sberbank.ru · @omega.sbrf.ru</p>
      <div style="text-align:center;margin-top:var(--space-4);">
        <button class="theme-toggle" type="button" data-theme-toggle style="margin:0 auto;">☀</button>
      </div>
    </div>
  </div>
  <script src="../scripts/app.js"></script>
</body>
</html>
