<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Digest CDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/typography.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
  <div class="concept-nav">
    <a href="../index.html">← Все экраны</a>
    <strong>Вход</strong>
  </div>

  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-card__header">
        <h1 class="text-h1" style="color: var(--color-primary);">Digest CDS</h1>
        <p class="text-caption">СВА · DS-направление</p>
      </div>

      <form class="form-stack" action="home.html">
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="field__input" id="email" type="email" placeholder="name@sberbank.ru" autocomplete="email">
        </div>
        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" id="password" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn--primary btn--block" type="submit">Войти</button>
      </form>

      <p class="text-body-sm text-secondary" style="text-align: center; margin-top: var(--space-6);">
        Нет аккаунта? <a href="#">Регистрация</a>
      </p>
      <p class="text-caption" style="text-align: center; margin-top: var(--space-4);">
        Доступ: @sberbank.ru, @omega.sbrf.ru
      </p>
    </div>
  </div>
</body>
</html>
